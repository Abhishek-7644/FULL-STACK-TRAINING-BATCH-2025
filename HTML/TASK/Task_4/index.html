<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image + Table</title>
</head>

<body>

<h1>My Image</h1>

<table border ="1" width="100%">
    <tr>

        <td width="30%">
            <img 
                height="400"
                width="200"
                src="https://cdn.pixabay.com/photo/2023/02/15/04/42/vector-gorilla-7790910_1280.png"
                alt="Gorilla Image">
        </td>

    
        <td width="70%">
            <table border ="1" width="100%" cellpadding="20" cellspacing="0">

                <tr height="80">
                    <th colspan="3"><img src="https://www.academy.indixpert.com/images/brand/logo/indixpert-logo.png"
    width="200"
    alt="Indixpert Logo"></th>
                </tr>

                <tr height="100">
                    <td colspan="3"> <img src="https://www.customguide.com/images/lessons/gmail/gmail-format-email-text--01.png"
    width="200"
    alt="Gmail Email Format">>
                    </td>
                </tr>

                <tr height="120">
                    <td colspan="2"> <img src = "https://img.freepik.com/free-photo/beautiful-lake-mountains_395237-44.jpg"
                    width = "150"
                alt = "Beautifull Lake and mountains"</td>
                    <td><img src = "https://images.pexels.com/photos/12441384/pexels-photo-12441384.jpeg"
                    width = "150"
                alt = "Dark Nature"</td>
                </tr>

                <tr height="120">
                    <td><img src = "https://images.pexels.com/photos/29087241/pexels-photo-29087241.jpeg"
                    width = "50"</td>
                    <td> <img src = "https://images.pexels.com/photos/30171530/pexels-photo-30171530.jpeg"
                    width = "50"
                alt = ""</td>
                    <td> <img src = "https://images.pexels.com/photos/32133640/pexels-photo-32133640.jpeg"
                    width = "50"</td>
                </tr>

                <tr height="80">
                    <td colspan="3" align="center"><img src ="https://images.pexels.com/photos/32807122/pexels-photo-32807122.jpeg"
                    width="50"</td>
                </tr>

            </table>
        </td>

    </tr>
</table>

</body>
</html>
