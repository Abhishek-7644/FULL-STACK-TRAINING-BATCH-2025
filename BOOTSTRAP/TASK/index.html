<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
Registration Form
</h2>

<form id="myForm">

<div class="row">

    <!-- First Name -->
    <div class="col-md-6 mb-3">
        <label>First Name</label>
        <input type="text" class="form-control" id="fname">
        <small class="text-danger" id="fnameError"></small>
    </div>

    <!-- Last Name -->
    <div class="col-md-6 mb-3">
        <label>Last Name</label>
        <input type="text" class="form-control" id="lname">
        <small class="text-danger" id="lnameError"></small>
    </div>

    <!-- Email -->
    <div class="col-md-12 mb-3">
        <label>Email</label>
        <input type="email" class="form-control" id="email">
        <small class="text-danger" id="emailError"></small>
    </div>

    <!-- Mobile -->
    <div class="col-md-12 mb-3">
        <label>Mobile Number</label>
        <input
            type="text"
            class="form-control"
            id="mobile"
            value="+91"
            maxlength="13">
        <small class="text-danger" id="mobileError"></small>
    </div>

    <!-- Password -->
    <div class="col-md-12 mb-3">
        <label>Password</label>
        <input type="password" class="form-control" id="password">
    </div>

    <!-- DOB -->
    <div class="col-md-6 mb-3">

        <label>Date Of Birth</label>

        <input
        type="date"
        class="form-control"
        id="dob"
        max="2008-12-31">

        <small class="text-danger" id="dobError"></small>

    </div>

    <div class="col-md-6 mb-3">

    <label class="d-block">Gender</label>

    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
        <label class="form-check-label" for="male">Male</label>
    </div>

    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
        <label class="form-check-label" for="female">Female</label>
    </div>

    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="others" value="Others">
        <label class="form-check-label" for="others">Others</label>
    </div>

    <small class="text-danger d-block" id="genderError"></small>

</div>

    <!-- Country -->
    <div class="col-md-6 mb-3">

        <label>Country</label>

        <select class="form-select" id="country">

            <option value="">Select Country</option>
            <option>India</option>
            <option>USA</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Japan</option>

        </select>

    </div>

    <!-- City -->
    <div class="col-md-6 mb-3">

        <label>City</label>

        <select class="form-select" id="city">

            <option value="">Select City</option>
            <option>Lucknow</option>
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Pune</option>
            <option>Jaipur</option>

        </select>

    </div>

</div>
<div class="row">
<div class=" col-md-12">
    <button type="submit">
        Submit
    </button>
  </div>
</div>

</form>
