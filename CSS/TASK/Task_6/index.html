<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
        margin: 0px;
        padding: 0px;
    }

    body{
        background: #dfd8d8;
        padding: 20px;
        }
   
        /* TASK 1 */
    .container{
        width: 500px;
       
        border: 2px solid rgb(24, 75, 109);
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        padding: 20px;
    }
    .box{
        background: rgb(50, 98, 140);
        border: 2px solid rgb(7, 53, 99);
        color: rgb(247, 242, 242);
        padding: 15px;
        border-radius: 10px; 
    }

        /* TASK 2 */
    .cards{
        margin-top: 50px;
        max-width: 620px;
        width: 100%;
        height: 250px;
        border: 3px solid rgb(6, 6, 25);
        display: grid;
        grid-template-columns: repeat(4,1fr);
        grid-template-rows: repeat(4,1fr);
        padding: 5px;
        margin-left: 5px;
        
    }

    .card-box1{
        background: rgb(107, 175, 197);
        color: white;
        padding: 10px;
        border-radius: 5px;
        grid-column: 1 / 3;
        grid-row: 1 / 3;
        z-index: 1;
        border: 3px solid rgb(19, 91, 111);
        width: 400px;
        height: 150px;
    }

    .card-box2{
        background: rgb(199, 36, 150);
        color: white;
        padding: 10px;
        border-radius: 5px;
        grid-column: 2 / 4;
        grid-row: 2 / 4;
        z-index: 2;
        border: 3px solid rgb(90, 6, 76);
        width: 400px;
        height: 150px;
        opacity: 0.6;
    }

        /* TASK 3 */
    .task3{
        width: 500px;
        display: grid;
        grid-template-columns: repeat(3, 1fr) ;
        grid-template-rows: repeat(3, 1fr);
        padding: 20px;
        border-radius: 5px;
        background:  rgb(245, 228, 228);
        gap: 20px;
        margin-top: 50px;
        border: 3px solid rgb(182, 222, 19);
    }
    .task{
        background: green ;
        border: 2px solid rgb(7, 58, 18);
        color: rgb(247, 242, 242);
        padding: 15px;
        border-radius: 10px; 
    }

    .task.box1{
         grid-column: 1 / 4;
    }
    .task.box2{
        grid-column: 1 / 2 ;
    }
    .task.box3{
        grid-column: 2 / 4;
    }

    .task.box4{
        grid-column: 2 / 4 ;
    }

    /* TASK 4 */

    .task4{
        width: 500px;
        margin-top: 50px;
        display: grid;
        grid-template-columns: repeat(3,1fr);
        grid-template-rows: repeat(2, auto);
        gap: 20px;
        
    }

    .task4 img{
        width: 100%;
        display: block;
        object-fit: cover;
        height: 150px;
        margin-bottom: 5px;
    }

    .tags{
        margin-top: 10px;
        text-align: center;
    }

    .tags span{
        background: rgb(198, 91, 82);
        color: white;
        padding: 5px 10px;
        font-size: 10px;
        border-radius: 5px;
        margin-right: 5px;
        display: inline-block;
        margin-top: 5px;
    }
   
</style>
<body>
    <h1>Task 1</h1>
    <div class="container">
        <div class="box box1">ONE</div>
        <div class="box box2">TWO</div>
        <div class="box box3">THREE</div>
        <div class="box box4">FOUR</div>
        
    </div>

    <h2>Task 2</h2>
    <div class="cards">
        <div class="card-box1">ONE</div>
        <div class="card-box2">TWO</div>
    </div>

    <h2>Task 3</h2>
    <div class="task3">
        <div class="task box1">ONE</div>
        <div class="task box2">TWO</div>
        <div class="task box3">THREE</div>
        <div class="task box4">FOUR</div>
        
    </div>

    <h2 >Task 4</h2>
    <div class="task4">
        <div class="image">
            <img src="https://mdn.github.io/shared-assets/images/examples/balloons1.jpg" alt="image">
            <div class="tags">
                <span>balloon</span>
                <span>red</span>
                <span>sky</span>
                <span>Blue</span>
                <span>Hot air balloon</span>
               
            </div>
        </div>
        <div class="image">
            <img src="https://mdn.github.io/shared-assets/images/examples/balloons2.jpg" atl="image">
            <div class="tags">
                <span>balloons</span>
                <span>houses</span>
                <span>train</span>
                <span>harborside</span>
            </div>    
        </div>
        <div class="image">
            <img src="https://mdn.github.io/shared-assets/images/examples/balloons3.jpg" alt="image">
            <div class="tags">
                <span>balloons</span>
                <span>inflating</span>
                <span>green</span>
                <span>Blue</span>
            </div>    
        </div>
        <div class="image">
            <img src="https://mdn.github.io/shared-assets/images/examples/balloons4.jpg " alt="image">
            <div class="tags">
                <span>balloon</span>
                <span>sun</span>
                <span>sky</span>
                <span>summer</span>
                <span>bright</span>
            </div>
        </div>

</body>
</html>
