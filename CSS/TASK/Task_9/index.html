<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 3</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#eeeeee;

}

.main{

    width:80%;

    margin:auto;

    margin-top:50px;
}

h1{

    color:blue;

    margin-bottom:30px;
}

p{

    font-size:20px;

    line-height:35px;

    margin-bottom:20px;
}



.grid{

    width:850px;

    border:1px solid blue;

    padding:10px;

    display:grid;

    gap:20px;

   
    grid-template-columns:1fr 1fr 1fr;

  
    grid-template-rows:80px 80px 80px;

   
    grid-template-areas:

    "one one one"
    "two three three"
    ". four four"; 
}

.box{

    background:#4875a2;

    color:white;

    border-radius:10px;

    padding:20px;

    font-size:25px;
}

.box1{

    grid-area:one;

    background:rgb(213, 134, 134);
}

.box2{

    grid-area:two;

    background:rgb(113, 167, 85);
}

.box3{

    grid-area:three;

    background:rgb(143, 97, 179);
}

.box4{

    grid-area:four;

    background:rgb(129, 154, 203);
}

</style>
</head>

<body>

<div class="main">

    <h1>Task 3</h1>

    <p>
        In this task, there are four direct children in this grid.
    </p>

    <p>
        Use the grid-area and grid-template-areas
        properties to lay the items out.
    </p>

   

    <div class="grid">

        <div class="box box1">One</div>

        <div class="box box2">Two</div>

        <div class="box box3">Three</div>

        <div class="box box4">Four</div>

    </div>

</div>

</body>
</html>
