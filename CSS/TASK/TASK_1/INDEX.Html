<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task - Design Creative Email Template</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Top Title Box */
        .title-box {
            background-color: #4a77cb;
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px solid #3b63b0;
        }

        /* Main Container */
        .main-container {
            width: 1000px;
            background-color: #4a77cb;
            border: 3px solid #e07a5f;
            display: flex;
        }

        /* Left Continuous Sidebar */
        .left-sidebar {
            width: 25%;
            border-right: 3px solid #e07a5f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        /* Right Content Area */
        .right-content {
            width: 75%;
            display: flex;
            flex-direction: column;
        }

        /* Section Boxes Styling */
        .section-box {
            border-bottom: 3px solid #e07a5f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 500;
        }

        /* Section Heights */
        .header-logo { height: 110px; }
        .email-body { height: 180px; }

        /* Row 1: 2 EQUAL IMAGES (50% - 50%) */
        .row-2-images {
            display: flex;
            height: 140px;
            border-bottom: 3px solid #e07a5f;
        }
        .row-2-images .img-col {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        .row-2-images .img-col:first-child {
            border-right: 3px solid #e07a5f;
        }

        /* Row 2: 3 EQUAL IMAGES (33.33% each) */
        .row-3-images {
            display: flex;
            height: 140px;
            border-bottom: 3px solid #e07a5f;
        }
        .row-3-images .img-col {
            width: 33.333%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            border-right: 3px solid #e07a5f;
        }
        .row-3-images .img-col:last-child {
            border-right: none;
        }

        /* Footer */
        .footer {
            height: 80px;
            border-bottom: none;
        }

        .box-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="title-box">
        Task - Design Creative Email Template for Student Registration
    </div>

    <div class="main-container">
        
        <!-- Left Side Column -->
        <div class="left-sidebar">
            Creative Vector image
        </div>

        <!-- Right Side Column -->
        <div class="right-content">
            
            <div class="section-box header-logo">
                Your Company logo
            </div>

            <div class="section-box email-body">
                Email Body
            </div>

            <!-- 2 Equal Image Boxes -->
            <div class="row-2-images">
                <div class="img-col">Images</div>
                <div class="img-col">Images</div>
            </div>

            <!-- 3 Equal Image Boxes -->
            <div class="row-3-images">
                <div class="img-col">Images</div>
                <div class="img-col">Images</div>
                <div class="img-col">Images</div>
            </div>

            <div class="section-box footer">
                Footer
            </div>

        </div>
    </div>

</body>
</html>
