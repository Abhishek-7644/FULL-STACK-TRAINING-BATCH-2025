<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>webpage</title>

<style>

*{
    margin:0;
    box-sizing:border-box;
}

body{
    background:#f3f3f3;
}

.container{

    width:1200px;
    height:700px;

    display:flex;
}

.sidebar{

    width:18%;
    height:100vh;

    background:#120914;
}

.main{

    width:82%;
    height:100vh;

    display:grid;

    grid-template-columns:repeat(2,1fr);

    grid-template-rows:
    80px
    180px
    180px
    180px;

    gap:20px;

    background:white;
}

.topbar{

    grid-column:1/3;

    background:#ffffff;

    border:1px solid lightgray;
}

.banner{

    grid-column:1/3;

    width:90%;
    height:140px;

    background:#ececec;

    justify-self:center;

    border-radius:10px;
}
.card-group{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

    width:80%;

    height:100px;

    border:1px solid #ddd;

    justify-self:center;

    align-self:center;
}

.small-box{

    background:#ececec;

    border-radius:6px;
}

.right-card{

    width:70%;

    height:160px;

    background:white;

    border:1px solid #ddd;

    justify-self:center;
}

.right-top{

    width:100%;

    height:70px;

    background:#ececec;
}

.right-bottom{

    width:100%;

    height:90px;

    background:white;
}

.double-box{

    width:70%;

    height:90px;

    border:1px solid #ddd;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    justify-self:center;
}


.inner{

    background:#ececec;

    border-radius:6px;
}

.bottom-bar{

    grid-column:1/3;

    width:90%;

    height:130px;

    background:#ececec;

    display:flex;

    justify-content:space-evenly;

    align-items:center;

    justify-self:center;

    border-radius:6px;
}

.item{

    width:90px;

    height:90px;

    background:#dcdcdc;

    border-radius:6px;
}

.special{

    background:white;
}

.split{

    overflow:hidden;
}

.split-top{

    width:100%;
    height:50%;

    background:#d0d0d0;
}

.split-bottom{

    width:100%;
    height:50%;

    background:white;
}

.last{

    width:50px;
    height:70px;
}

</style>

</head>

<body>

<div class="container">

    <div class="sidebar"></div>

   

    <div class="main">


        <div class="topbar"></div>


        <div class="banner"></div>


        <div class="card-group">

            <div class="small-box"></div>

            <div class="small-box"></div>

            <div class="small-box"></div>

        </div>


        <div class="right-card">

            <div class="right-top"></div>

            <div class="right-bottom"></div>

        </div>


        <div class="double-box">

            <div class="inner"></div>

            <div class="inner"></div>

        </div>


        <div></div>


        <div class="bottom-bar">

            <div class="item"></div>

            <div class="item split">

                <div class="split-top"></div>

                <div class="split-bottom"></div>

            </div>

            <div class="item"></div>

            <div class="item special"></div>

            <div class="item last"></div>

        </div>

    </div>

</div>

</body>
</html>
