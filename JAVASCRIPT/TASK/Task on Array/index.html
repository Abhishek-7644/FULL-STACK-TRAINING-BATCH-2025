<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Javascript DATA TYPE CHAPTER</h1>
    <script>
    let arr = ['a', 'b', 'c', 'd'];

    Array.prototype.myMap = function(callback) {

        let newArr = [];

        for (let i = 0; i < this.length; i++) {
            newArr.push(callback(this[i], i, this));
        }

        return newArr;
    };


    let newArr = arr.myMap((val, i) => {
        return val + i;
    });

    console.log(newArr);

    </script>
</body>
</html>
