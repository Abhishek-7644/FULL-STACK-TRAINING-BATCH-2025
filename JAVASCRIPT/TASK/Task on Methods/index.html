       const users = [  {

//   ========== #  Task 1. String operations =========

//  Question A: Remove extra space from name 

for (let user of users) {
    user.name = user.name.trim().replace(/\s+/g, " ");
}

console.log(users);

//  Question B: Chance the name into Title Case

for (let user of users) {
    user.name = user.name.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

console.log(users);


//  Question c: Change The name in array Format

let names = users.map(user => user.name);

console.log(names);



//   ========== #  Task 2.  Number Operations=========

// Question A: Question A: Remove extra space from name  

let skills = users.flatMap(user => user.skills);

let uniqueSkills = [...new Set(skills)];

console.log(uniqueSkills);
